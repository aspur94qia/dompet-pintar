name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Repair android project
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf android
          flutter create . --project-name dompet_pintar --org com.aspur --no-overwrite
          cp /tmp/main.dart lib/main.dart
      - run: flutter pub add intl
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dompet-pintar-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
