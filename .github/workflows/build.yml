name: Build Premium v2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Setup Project
        run: |
          cp lib/main.dart /tmp/m.dart
          rm -rf android
          flutter create . --project-name dompet_pintar --org com.aspur --no-overwrite
          cp /tmp/m.dart lib/main.dart
      - name: Icon Premium
        run: |
          pip3 install pillow -q
          python3 << 'PY'
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1024,1024), (15,23,42))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((190,250,900,820), radius=40, fill=(255,255,255))
          d.rounded_rectangle((400,350,800,700), radius=20, fill=(15,23,42))
          d.line((580,350,580,700), fill=(255,255,255), width=15)
          for p in ["android/app/src/main/res/mipmap-hdpi/ic_launcher.png","android/app/src/main/res/mipmap-mdpi/ic_launcher.png","android/app/src/main/res/mipmap-xhdpi/ic_launcher.png","android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png","android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"]:
              img.save(p)
          print("icon done")
          PY
          sed -i 's/android:label=".*"/android:label="DompetKu"/' android/app/src/main/AndroidManifest.xml || true
      - run: flutter pub add shared_preferences intl path_provider
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: DompetKu-Premium-Pro
          path: build/app/outputs/flutter-apk/
