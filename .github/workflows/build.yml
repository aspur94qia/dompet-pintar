name: Build DompetKu Cepat
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Repair
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf android
          flutter create . --project-name dompet_pintar --org com.aspur --no-overwrite
          cp /tmp/main.dart lib/main.dart
          sed -i 's/android:label=".*"/android:label="DompetKu"/' android/app/src/main/AndroidManifest.xml || true
      - run: flutter pub add shared_preferences intl path_provider
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: DompetKu-Cepat-Premium
          path: build/app/outputs/flutter-apk/
